name: Build and Deploy WatchTower

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
      - 'WatchTower.slnx'
      - 'global.json'
      - 'Directory.*.props'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DOTNET_VERSION: '10.0.x'
      SERVICE_NAME: 'WatchTower'
      DEPLOY_PATH: 'C:\Services\WatchTower'
      BACKUP_ROOT: 'C:\Services\WatchTower.backups'
      MAX_BACKUPS: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: powershell
        run: |
          # Check if any tags exist at all
          $hasTags = git tag

          if ($null -eq $hasTags -or $hasTags.Count -eq 0) {
            $newVersion = "v1.0.0"
          } else {
            # If tags exist, it is safe to run git describe
            $latestTag = git describe --tags --abbrev=0 2>$null

            $clean = $latestTag -replace '^v', ''
            $parts = $clean.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2] + 1
            $newVersion = "v$major.$minor.$patch"
          }

          Write-Host "New version: $newVersion"

          # Write to GitHub Output
          "VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION_NUMBER=$($newVersion -replace '^v', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore tests/WatchTower.Tests/WatchTower.Tests.csproj

      - name: Build
        run: dotnet build tests/WatchTower.Tests/WatchTower.Tests.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION_NUMBER }}

      - name: Run tests
        run: dotnet test --project tests/WatchTower.Tests/WatchTower.Tests.csproj --configuration Release --no-build --report-trx

      - name: Publish
        run: dotnet publish src/WatchTower/WatchTower.csproj --configuration Release --output ./publish --runtime win-x64 -p:Version=${{ steps.version.outputs.VERSION_NUMBER }}

      - name: Stop service (if running)
        shell: powershell
        run: |
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($service -and $service.Status -eq 'Running') {
            Stop-Service -Name $env:SERVICE_NAME -Force
            Start-Sleep -Seconds 3
          }

      - name: Backup current deployment
        id: backup
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          $backupRoot = "${{ env.BACKUP_ROOT }}"

          if (-not (Test-Path $backupRoot)) {
            New-Item -ItemType Directory -Path $backupRoot -Force
          }

          if (Test-Path "$deployPath\WatchTower.exe") {
            # Try to read the current version from the deployed exe
            try {
              $currentVersion = (Get-Item "$deployPath\WatchTower.exe").VersionInfo.ProductVersion
              if (-not $currentVersion) { $currentVersion = "unknown" }
            } catch {
              $currentVersion = "unknown"
            }

            $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
            $backupName = "v$currentVersion-$timestamp"
            $backupPath = "$backupRoot\$backupName"

            Write-Host "Backing up current deployment to: $backupPath"
            Copy-Item -Path $deployPath -Destination $backupPath -Recurse -Force

            echo "BACKUP_PATH=$backupPath" >> $env:GITHUB_OUTPUT
            echo "HAS_BACKUP=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No existing deployment found, skipping backup"
            echo "HAS_BACKUP=false" >> $env:GITHUB_OUTPUT
          }

      - name: Prune old backups
        shell: powershell
        run: |
          $backupRoot = "${{ env.BACKUP_ROOT }}"
          $maxBackups = ${{ env.MAX_BACKUPS }}

          if (Test-Path $backupRoot) {
            $backups = Get-ChildItem -Path $backupRoot -Directory | Sort-Object CreationTime -Descending
            if ($backups.Count -gt $maxBackups) {
              $toDelete = $backups | Select-Object -Skip $maxBackups
              foreach ($dir in $toDelete) {
                Write-Host "Pruning old backup: $($dir.Name)"
                Remove-Item -Path $dir.FullName -Recurse -Force
              }
            }
            Write-Host "Backups retained: $(($backups | Select-Object -First $maxBackups).Count)"
          }

      - name: Deploy files
        shell: powershell
        run: |
          $deployPath = "${{ env.DEPLOY_PATH }}"
          if (-not (Test-Path $deployPath)) {
            New-Item -ItemType Directory -Path $deployPath -Force
          }

          # Runtime state to carry across the deploy (config, DB + WAL sidecars, the
          # portal-applied overlay, and the last-report marker).
          $preserve = @(
            'appsettings.json',
            'watchtower.db', 'watchtower.db-wal', 'watchtower.db-shm',
            'remote-config.json',
            'last-report.txt'
          )

          $stage = Join-Path $env:TEMP "wt-preserve"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($f in $preserve) {
            if (Test-Path "$deployPath\$f") { Copy-Item "$deployPath\$f" "$stage\$f" -Force }
          }

          # Clear stale binaries from the previous version (renamed/removed DLLs would
          # otherwise linger and could be loaded). Keep the Logs directory for history.
          Get-ChildItem -Path $deployPath -Force -Exclude 'Logs' |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item -Path ./publish/* -Destination $deployPath -Recurse -Force

          # Restore preserved runtime state, overwriting any published defaults.
          foreach ($f in $preserve) {
            if (Test-Path "$stage\$f") {
              Copy-Item "$stage\$f" "$deployPath\$f" -Force
              Write-Host "Preserved $f"
            }
          }
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

      - name: Register service
        shell: powershell
        run: |
          # Idempotent: creates the service or updates its binPath, delayed-auto start and
          # crash-recovery actions; also creates and locks down the data directory.
          & "${{ env.DEPLOY_PATH }}\WatchTower.exe" install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start service
        shell: powershell
        run: Start-Service -Name $env:SERVICE_NAME

      - name: Verify service readiness
        id: verify
        shell: powershell
        run: |
          # A Windows service reports 'Running' the instant StartAsync returns, before any
          # worker has done useful work. Gate on a real readiness signal instead: poll the
          # log for a worker "started" line, fail fast on a fatal/config error, and confirm
          # the service is still running at the end (catches crash-on-start loops).
          $deployPath = "${{ env.DEPLOY_PATH }}"
          # Logs live in the data directory, not next to the binaries.
          $logDir = Join-Path $env:ProgramData "WatchTower\Logs"
          $healthy = $false
          $fatal = $false

          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
            if ($null -eq $service) { continue }

            $log = $null
            if (Test-Path $logDir) {
              $log = Get-ChildItem "$logDir\watchtower-*.log" -ErrorAction SilentlyContinue |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
            }
            if ($log) {
              $tail = Get-Content $log.FullName -Tail 300 -ErrorAction SilentlyContinue
              if ($tail -match 'terminated unexpectedly' -or $tail -match 'Invalid configuration:') {
                Write-Host "::error::Fatal startup error detected in log"
                $fatal = $true
                break
              }
              if (($service.Status -eq 'Running') -and ($tail -match 'Worker started')) {
                $healthy = $true
                break
              }
            }
          }

          # Final confirmation that the service did not crash after coming up.
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($fatal -or -not $healthy -or $null -eq $service -or $service.Status -ne 'Running') {
            Write-Host "::error::Service failed readiness check. Status: $($service.Status)"
            echo "HEALTHY=false" >> $env:GITHUB_OUTPUT
            exit 1
          }
          Write-Host "Service is running and a worker reported ready"
          echo "HEALTHY=true" >> $env:GITHUB_OUTPUT

      - name: Auto-rollback on failure
        # Roll back on ANY failure once a backup exists — not only when the verify step
        # set HEALTHY=false. An earlier step (e.g. Start service) can fail before verify
        # runs, leaving the new (broken) binaries in place with no rollback.
        if: failure() && steps.backup.outputs.HAS_BACKUP == 'true'
        shell: powershell
        run: |
          $backupPath = "${{ steps.backup.outputs.BACKUP_PATH }}"
          $deployPath = "${{ env.DEPLOY_PATH }}"

          Write-Host "::warning::ROLLING BACK to $backupPath"

          # Stop the broken service
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name $env:SERVICE_NAME -Force
            Start-Sleep -Seconds 3
          }

          # Restore from backup. Clear the failed deploy's files first (keep Logs) so no
          # stale binaries from the bad version remain alongside the restored ones.
          Get-ChildItem -Path $deployPath -Force -Exclude 'Logs' |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$backupPath\*" -Destination $deployPath -Recurse -Force
          Write-Host "Files restored from backup"

          # Start the previous version
          Start-Service -Name $env:SERVICE_NAME
          Start-Sleep -Seconds 5

          $service = Get-Service -Name $env:SERVICE_NAME
          if ($service.Status -eq 'Running') {
            Write-Host "::warning::Rollback successful. Previous version is running."
          } else {
            Write-Host "::error::Rollback failed. Service status: $($service.Status). Manual intervention required."
          }

          # Fail the pipeline to signal the deploy was bad
          exit 1

      - name: Package binaries
        shell: powershell
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./WatchTower-${{ steps.version.outputs.VERSION_NUMBER }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: WatchTower ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ./WatchTower-*.zip
