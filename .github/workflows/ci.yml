name: CI

# Build, format check, tests and a packaging smoke test on GitHub-hosted runners for every
# push and pull request (safe for pull requests from forks: nothing runs on our own servers).

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'branding/**', 'logo.png']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WatchTower.slnx

      - name: Check formatting
        run: dotnet format WatchTower.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WatchTower.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/WatchTower.Tests/WatchTower.Tests.csproj --configuration Release --no-build --report-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 7

      - name: Package (smoke test)
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: ./build/package.ps1 -Version "0.0.0-ci.$env:RUN_NUMBER" -Repository $env:REPOSITORY -OutputDir artifacts

      - name: Release notes (smoke test)
        shell: pwsh
        # The script release.yml runs; here from this commit's own subjects (no pull request lookup).
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ./build/release-notes.ps1 -Version 0.0.0-ci -Repository $env:REPOSITORY -Sha $env:SHA -OutFile artifacts/release-notes.md -NoPullRequest
          if (-not (Get-Content artifacts/release-notes.md -Raw).Contains('Good to know')) { throw 'release notes were not written' }

      - name: One-line installer (smoke test)
        shell: pwsh
        # get-watchtower.ps1 against the package just built: verify, extract, install a throwaway
        # service with the options passed through, uninstall it; then a damaged zip is refused.
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'wt-get'
          $pw = ConvertTo-SecureString 'ci-console-password-1' -AsPlainText -Force
          ./build/get-watchtower.ps1 -DownloadBaseUrl artifacts -ServiceName WatchTowerCI -InstallDir "$root\bin" -DataDir "$root\data" -AdminPassword $pw -NoStart
          $svc = Get-Service -Name WatchTowerCI
          if ($svc.Status -ne 'Stopped') { throw "Expected WatchTowerCI installed and stopped (-NoStart), got $($svc.Status)" }
          if ((Get-Content "$root\data\config\watchtower.settings.json" -Raw) -notmatch 'AdminPasswordHash') { throw '-AdminPassword was not passed through' }
          & "$root\bin\WatchTower.exe" uninstall --service-name WatchTowerCI --data-dir "$root\data" --purge-data
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed ($LASTEXITCODE)" }

          $bad = Join-Path $env:RUNNER_TEMP 'wt-bad'
          New-Item -ItemType Directory -Path $bad | Out-Null
          Copy-Item artifacts/SHA256SUMS.txt, artifacts/WatchTower-*.zip -Destination $bad
          $zip = Get-ChildItem $bad -Filter 'WatchTower-*.zip'
          [IO.File]::AppendAllText($zip.FullName, 'x')
          $refused = $false
          try { ./build/get-watchtower.ps1 -DownloadBaseUrl $bad -ServiceName WatchTowerCI2 -NoStart }
          catch { $refused = $_.Exception.Message -like 'SHA-256 mismatch*' }
          if (-not $refused) { throw 'A damaged zip was not refused' }
          if (Get-Service -Name WatchTowerCI2 -ErrorAction SilentlyContinue) { throw 'Installed despite the checksum mismatch' }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: watchtower-ci-package
          path: |
            artifacts/WatchTower-*.zip
            artifacts/watchtower-update.json
            artifacts/get-watchtower.ps1
            artifacts/SHA256SUMS.txt
          retention-days: 7
