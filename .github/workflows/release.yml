name: Release WatchTower

# Publishes a release on GitHub-hosted runners:
#   - every push to main that changes the product → next patch version (v1.2.3 → v1.2.4)
#   - manual "Run workflow" → the version you enter (e.g. 1.3.0 or 1.3.0-beta.1), or next patch
#
# Each release carries:
#   WatchTower-<version>-win-x64.zip   self-contained exe + install.ps1 (no .NET needed)
#   watchtower-update.json             manifest the agents' self-updater reads
#   get-watchtower.ps1                 one-line installer: downloads, verifies and installs a
#                                      release (releases/latest/download/get-watchtower.ps1)
#   SHA256SUMS.txt                     checksums of the zip and of get-watchtower.ps1
#
# Servers pick releases up through WatchTower's built-in updater (console → Updates, or the
# portal's "Update agent" command); there is no push deployment to servers from CI.
#
# Set the repository secret WATCHTOWER_SIGNING_KEY (ECDSA P-256 private key, PEM) to sign
# packages; agents configured with the matching public key (Updates:PublicKey) then install
# only signed releases.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'global.json'
      - 'Directory.*.props'
      - 'WatchTower.slnx'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.6.0 or 1.6.0-beta.1). Empty = next patch version.'
        required: false

permissions:
  contents: write
  pull-requests: read # release notes are taken from the merged pull request's "Release notes" section

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        # Untrusted values reach the script only through environment variables, never by
        # template expansion into the script text (avoids script injection).
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = "$env:INPUT_VERSION".Trim().TrimStart('v')
          # The highest existing vX.Y.Z tag: the base of the next patch and of the release notes.
          $latest = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]($_.TrimStart('v')) } |
            Sort-Object -Descending | Select-Object -First 1
          if (-not $v) {
            # Next patch after it (v1.0.0 when there is none).
            $v = if ($latest) { "$($latest.Major).$($latest.Minor).$($latest.Build + 1)" } else { '1.0.0' }
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Invalid version '$v'" }
          if (git tag --list "v$v") { throw "Tag v$v already exists" }
          Write-Host "Releasing v$v"
          "number=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "previous=$(if ($latest) { "v$latest" })" >> $env:GITHUB_OUTPUT

      - name: Write release notes
        shell: pwsh
        # Shown to users under "What's new" in the agent's console and on the release page:
        # the merged pull request's "## Release notes" section, else the feat/fix/perf commits.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: ./build/release-notes.ps1 -Version $env:VERSION -PreviousTag $env:PREVIOUS -Repository $env:REPOSITORY -Sha $env:SHA -OutFile artifacts/release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: dotnet build WatchTower.slnx --configuration Release "-p:Version=$env:VERSION"
        shell: pwsh

      - name: Test
        run: dotnet test --project tests/WatchTower.Tests/WatchTower.Tests.csproj --configuration Release --no-build --report-trx

      - name: Package
        shell: pwsh
        env:
          WATCHTOWER_SIGNING_KEY: ${{ secrets.WATCHTOWER_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: ./build/package.ps1 -Version $env:VERSION -Repository $env:REPOSITORY -OutputDir artifacts -NotesFile artifacts/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: WatchTower v${{ steps.version.outputs.number }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/WatchTower-*.zip
            artifacts/watchtower-update.json
            artifacts/get-watchtower.ps1
            artifacts/SHA256SUMS.txt
